<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Baku Estetic Clinic</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f4f8;color:#2c3e50;min-height:100vh}
img{max-width:100%;display:block}
/* ── Auth ── */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0d3d52,#1a6b8a)}
.auth-box{background:#fff;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.auth-logo{font-size:1.5rem;font-weight:700;color:#1a6b8a;margin-bottom:20px;text-align:center}
.auth-box h2{font-size:1.4rem;font-weight:700;margin-bottom:6px;text-align:center;color:#1a2332}
.auth-sub{color:#7f8c8d;font-size:.9rem;text-align:center;margin-bottom:24px}
/* ── Layout ── */
.admin-header{background:#1a2332;color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100}
.admin-logo{font-size:1rem;font-weight:700}
.admin-logout{font-size:.82rem;cursor:pointer;background:none;border:1px solid rgba(255,255,255,.25);padding:6px 14px;border-radius:6px;color:rgba(255,255,255,.85);transition:.2s}
.admin-logout:hover{background:rgba(255,255,255,.1)}
.tabs{background:#fff;border-bottom:1px solid #dce6f0;display:flex;overflow-x:auto;padding:0 24px}
.tab-btn{padding:14px 20px;font-size:.88rem;font-weight:600;color:#7f8c8d;border:none;background:none;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:.2s}
.tab-btn:hover{color:#1a6b8a}
.tab-btn.active{color:#1a6b8a;border-bottom-color:#1a6b8a}
.admin-body{max-width:1100px;margin:0 auto;padding:32px 24px}
/* ── Cards ── */
.card{background:#fff;border-radius:12px;padding:28px;margin-bottom:24px;box-shadow:0 2px 12px rgba(26,107,138,.07);border:1px solid #dce6f0}
.card-title{font-size:1.05rem;font-weight:700;color:#1a2332;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid #f0f4f8}
/* ── Gallery ── */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:8px}
.gal-pair{background:#f8fafc;border:1px solid #dce6f0;border-radius:10px;overflow:hidden}
.gal-pair-imgs{display:grid;grid-template-columns:1fr 1fr}
.gal-img-wrap{display:flex;flex-direction:column}
.gal-img-wrap img{width:100%;height:130px;object-fit:cover}
.gal-lbl{font-size:.7rem;font-weight:700;letter-spacing:1px;text-align:center;padding:4px;text-transform:uppercase}
.gal-lbl.before{background:#e8f0fb;color:#1a6b8a}
.gal-lbl.after{background:#e8f5e9;color:#2e7d32}
.gal-caption{padding:8px 12px;font-size:.82rem;color:#6b7280}
.gal-actions{padding:8px 12px 12px;display:flex;justify-content:flex-end}
/* ── Patients ── */
.patient-search{display:flex;gap:10px;margin-bottom:20px}
.patient-search input{flex:1;padding:10px 14px;border:1.5px solid #dce6f0;border-radius:8px;font-family:inherit;font-size:.9rem;outline:none}
.patient-search input:focus{border-color:#1a6b8a}
.patient-list{display:flex;flex-direction:column;gap:8px}
.patient-row{background:#f8fafc;border:1px solid #dce6f0;border-radius:10px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:.15s}
.patient-row:hover{border-color:#1a6b8a;background:#f0f7fb}
.patient-row.active{border-color:#1a6b8a;background:#e8f4fa}
.patient-name{font-weight:600;font-size:.95rem}
.patient-meta{font-size:.8rem;color:#7f8c8d;margin-top:2px}
.patient-badge{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#e8f0fb;color:#1a6b8a}
.patient-detail{margin-top:24px}
.visit-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.visit-card{background:#f8fafc;border:1px solid #dce6f0;border-radius:10px;padding:14px 16px}
.visit-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.visit-date{font-size:.82rem;font-weight:700;color:#1a2332}
.visit-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:12px}
.tag-doctor{background:#e8f0fb;color:#1a6b8a}
.tag-treatment{background:#fef3c7;color:#92400e}
.tag-next{background:#d1fae5;color:#065f46}
.visit-notes{font-size:.85rem;color:#6b7280;margin-top:6px;line-height:1.5}
/* ── Forms ── */
.field{margin-bottom:16px}
.field label{display:block;font-size:.82rem;font-weight:600;color:#374151;margin-bottom:6px}
.field input,.field textarea,.field select{width:100%;padding:10px 14px;border:1.5px solid #dce6f0;border-radius:8px;font-family:inherit;font-size:.9rem;color:#2c3e50;background:#fff;transition:border-color .2s;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#1a6b8a}
.field textarea{resize:vertical;min-height:76px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.upload-area{border:2px dashed #dce6f0;border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:.2s;background:#fafbfd}
.upload-area:hover{border-color:#1a6b8a;background:#f0f7fb}
.upload-area input{display:none}
.up-label{font-size:.8rem;color:#9ca3af;margin-top:4px}
.upload-preview{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-top:10px;display:none}
/* ── Buttons ── */
.btn-primary{width:100%;padding:12px;background:#1a6b8a;color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary:hover{background:#145572}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-sm{padding:6px 14px;border:none;border-radius:6px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-danger{background:#fee2e2;color:#dc2626}
.btn-danger:hover{background:#dc2626;color:#fff}
.btn-outline{padding:8px 18px;border:1.5px solid #1a6b8a;color:#1a6b8a;background:none;border-radius:8px;font-family:inherit;font-size:.88rem;font-weight:600;cursor:pointer;transition:.2s}
.btn-outline:hover{background:#1a6b8a;color:#fff}
/* ── Alerts ── */
.alert{padding:12px 16px;border-radius:8px;font-size:.88rem;font-weight:500;margin-bottom:16px}
.alert-ok{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.alert-err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.empty-state{text-align:center;padding:48px 20px;color:#bdc3c7;font-size:1rem}
.loading{text-align:center;padding:48px;color:#7f8c8d}
@media(max-width:640px){.form-row{grid-template-columns:1fr}.admin-body{padding:20px 16px}.card{padding:20px 16px}.gal-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- SETUP -->
<div id="app-setup" class="auth-page" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">🦷 Admin Panel</div>
    <h2>İlk quraşdırma</h2>
    <p class="auth-sub">Admin şifrəsini təyin edin</p>
    <div id="setup-err" class="alert alert-err" style="display:none"></div>
    <form id="setup-form">
      <div class="field"><label>Şifrə (min 6 simvol)</label>
        <input type="password" id="setup-pw" required minlength="6" autofocus></div>
      <div class="field"><label>Şifrəni təkrarla</label>
        <input type="password" id="setup-pw2" required minlength="6"></div>
      <button type="submit" id="setup-btn" class="btn-primary">Quraşdır</button>
    </form>
  </div>
</div>

<!-- LOGIN -->
<div id="app-login" class="auth-page" style="display:none">
  <div class="auth-box">
    <div class="auth-logo">🦷 Admin Panel</div>
    <h2>Giriş</h2>
    <p class="auth-sub">Baku Estetic Clinic</p>
    <div id="login-err" class="alert alert-err" style="display:none"></div>
    <form id="login-form">
      <div class="field"><label>Şifrə</label>
        <input type="password" id="login-pw" required autofocus></div>
      <button type="submit" id="login-btn" class="btn-primary">Daxil ol</button>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="app-dashboard" style="display:none">
  <header class="admin-header">
    <div class="admin-logo">🦷 Baku Estetic Clinic — Admin</div>
    <button class="admin-logout" onclick="logout()">Çıxış</button>
  </header>
  <nav class="tabs">
    <button class="tab-btn active" id="tab-btn-gallery"  onclick="showTab('gallery')">📷 Qalereya</button>
    <button class="tab-btn"        id="tab-btn-patients" onclick="showTab('patients')">👤 Xəstələr</button>
    <button class="tab-btn"        id="tab-btn-settings" onclick="showTab('settings')">⚙️ Parametrlər</button>
  </nav>
  <main class="admin-body">
    <div id="tab-gallery">
      <div id="gallery-loading" class="loading">Yüklənir...</div>
      <div id="gallery-content" style="display:none"></div>
    </div>
    <div id="tab-patients" style="display:none">
      <div id="patients-loading" class="loading">Yüklənir...</div>
      <div id="patients-content" style="display:none"></div>
    </div>
    <div id="tab-settings" style="display:none">
      <div class="card" style="max-width:440px">
        <div class="card-title">🔒 Şifrəni dəyiş</div>
        <div id="pw-msg" style="display:none"></div>
        <form id="pw-form">
          <div class="field"><label>Yeni şifrə</label>
            <input type="password" name="password" required minlength="6"></div>
          <div class="field"><label>Yeni şifrəni təkrarla</label>
            <input type="password" name="confirm" required minlength="6"></div>
          <button type="submit" class="btn-primary">Dəyiş</button>
        </form>
      </div>
    </div>
  </main>
</div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────────
const API = '/api';
const DOCTORS = { aygun: 'Dr. Aygün Rzayeva', elcan: 'Dr. Elcan Həmidli', '': '—' };
const TREATMENTS = {
  '':'—', consultation:'Konsultasiya', braces:'Breket', implant:'İmplant',
  whitening:'Ağartma', veneer:'Vinir', crown:'Zirkonium tac',
  extraction:'Diş çıxarma', root_canal:'Kanal müalicəsi',
  cleaning:'Diş təmizliyi', prosthesis:'Protez', other:'Digər'
};
const NEXT_STEPS = {
  '':'—', '1w':'1 həftədən sonra', '2w':'2 həftədən sonra',
  '1m':'1 aydan sonra', '3m':'3 aydan sonra', '6m':'6 aydan sonra',
  done:'Müalicə tamamlandı', await_call:'Zəng gözlənilir'
};

// ── State ─────────────────────────────────────────────────────────────────────
let token = sessionStorage.getItem('adminToken') || '';
let galleryData = null;
let patientsData = null;
let selectedPatient = null;
const loadedTabs = new Set();

// ── Helpers ───────────────────────────────────────────────────────────────────
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function api(path, method = 'GET', body = null) {
  const opts = { method, headers: { Authorization: `Bearer ${token}` } };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(`${API}${path}`, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function sel(opts, selected = '', cls = '') {
  return Object.entries(opts).map(([v,l]) =>
    `<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`
  ).join('');
}

function showMsg(id, text, isErr) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `alert ${isErr ? 'alert-err' : 'alert-ok'}`;
  el.style.display = 'block';
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('az-AZ');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  if (token) { showDashboard(); return; }
  const { setup } = await api('/auth/status').catch(() => ({ setup: false }));
  if (!setup) {
    document.getElementById('app-setup').style.display = 'flex';
  } else {
    document.getElementById('app-login').style.display = 'flex';
  }
}

// ── Setup ─────────────────────────────────────────────────────────────────────
document.getElementById('setup-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('setup-pw').value;
  const pw2 = document.getElementById('setup-pw2').value;
  if (pw !== pw2) { showMsg('setup-err','Şifrələr eyni deyil.',true); return; }
  const btn = document.getElementById('setup-btn');
  btn.disabled = true; btn.textContent = 'Qurulur...';
  try {
    await api('/auth/setup', 'POST', { password: pw });
    document.getElementById('app-setup').style.display = 'none';
    document.getElementById('app-login').style.display = 'flex';
  } catch(err) {
    showMsg('setup-err', err.message, true);
    btn.disabled = false; btn.textContent = 'Quraşdır';
  }
});

// ── Login ─────────────────────────────────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('login-pw').value;
  const btn = document.getElementById('login-btn');
  document.getElementById('login-err').style.display = 'none';
  btn.disabled = true; btn.textContent = 'Yüklənir...';
  try {
    const { token: t } = await api('/auth/login', 'POST', { password: pw });
    token = t;
    sessionStorage.setItem('adminToken', t);
    document.getElementById('app-login').style.display = 'none';
    showDashboard();
  } catch(err) {
    showMsg('login-err', err.message, true);
    btn.disabled = false; btn.textContent = 'Daxil ol';
  }
});

function logout() {
  sessionStorage.removeItem('adminToken');
  token = ''; galleryData = null; patientsData = null;
  selectedPatient = null; loadedTabs.clear();
  document.getElementById('app-dashboard').style.display = 'none';
  document.getElementById('login-pw').value = '';
  document.getElementById('login-err').style.display = 'none';
  document.getElementById('app-login').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('app-dashboard').style.display = 'block';
  showTab('gallery');
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(tab) {
  ['gallery','patients','settings'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t === tab ? 'block' : 'none';
    document.getElementById(`tab-btn-${t}`).classList.toggle('active', t === tab);
  });
  if (!loadedTabs.has(tab)) {
    loadedTabs.add(tab);
    if (tab === 'gallery')  loadGallery();
    if (tab === 'patients') loadPatients();
  }
}

// ── Gallery ───────────────────────────────────────────────────────────────────
async function loadGallery() {
  try {
    galleryData = await api('/gallery');
    renderGallery();
  } catch(e) {
    document.getElementById('gallery-loading').textContent = 'Xəta: ' + e.message;
  }
}

function renderGallery() {
  document.getElementById('gallery-loading').style.display = 'none';
  const c = document.getElementById('gallery-content');
  c.style.display = 'block';
  document.getElementById('tab-btn-gallery').textContent = `📷 Qalereya (${galleryData.length})`;

  const grid = galleryData.length === 0
    ? '<div class="empty-state">🖼️ Hələ foto yoxdur. Aşağıdan əlavə edin.</div>'
    : `<div class="gal-grid">${galleryData.map(g => `
      <div class="gal-pair">
        <div class="gal-pair-imgs">
          <div class="gal-img-wrap">
            <img src="/images/gallery/${esc(g.before)}" onerror="this.style.background='#f0f4f8';this.removeAttribute('src')">
            <div class="gal-lbl before">Before</div>
          </div>
          <div class="gal-img-wrap">
            <img src="/images/gallery/${esc(g.after)}" onerror="this.style.background='#f0f4f8';this.removeAttribute('src')">
            <div class="gal-lbl after">After</div>
          </div>
        </div>
        ${g.caption_az ? `<div class="gal-caption">${esc(g.caption_az)}</div>` : ''}
        <div class="gal-actions">
          <button class="btn-sm btn-danger" onclick="deleteGallery('${esc(g.id)}')">🗑 Sil</button>
        </div>
      </div>`).join('')}</div>`;

  c.innerHTML = `
    <div class="card"><div class="card-title">📷 Mövcud foto cütləri</div>${grid}</div>
    <div class="card">
      <div class="card-title">➕ Yeni foto cütü əlavə et</div>
      <form id="gal-form" onsubmit="addGallery(event)">
        <div class="form-row">
          <div class="field"><label>Öncəsi şəkli (ixtiyari)</label>
            <div class="upload-area" onclick="document.getElementById('up-b').click()">
              <input type="file" id="up-b" accept="image/*" onchange="prevFile(this,'pb','lb')">
              <div id="lb">📁 Şəkil seç</div>
              <div class="up-label">JPG/PNG/WEBP — max 5 MB</div>
              <img id="pb" class="upload-preview">
            </div>
          </div>
          <div class="field"><label>Sonrası şəkli *</label>
            <div class="upload-area" onclick="document.getElementById('up-a').click()">
              <input type="file" id="up-a" accept="image/*" required onchange="prevFile(this,'pa','la')">
              <div id="la">📁 Şəkil seç</div>
              <div class="up-label">JPG/PNG/WEBP — max 5 MB</div>
              <img id="pa" class="upload-preview">
            </div>
          </div>
        </div>
        <div class="field"><label>Başlıq — Azərbaycanca</label>
          <textarea name="caption_az" rows="2" placeholder="Azərbaycanca açıqlama..."></textarea></div>
        <div class="field"><label>Başlıq — Rusca</label>
          <textarea name="caption_ru" rows="2" placeholder="Описание на русском..."></textarea></div>
        <div class="field"><label>Başlıq — İngiliscə</label>
          <textarea name="caption_en" rows="2" placeholder="Caption in English..."></textarea></div>
        <div id="gal-msg" style="display:none"></div>
        <button type="submit" id="gal-btn" class="btn-primary">Yüklə və əlavə et</button>
      </form>
    </div>`;
}

function prevFile(input, imgId, lblId) {
  const img = document.getElementById(imgId), lbl = document.getElementById(lblId);
  if (input.files?.[0]) {
    const r = new FileReader();
    r.onload = e => { img.src = e.target.result; img.style.display = 'block'; };
    r.readAsDataURL(input.files[0]);
    lbl.textContent = input.files[0].name;
  }
}

async function addGallery(e) {
  e.preventDefault();
  const form = e.target;
  const bFile = document.getElementById('up-b').files[0];
  const aFile = document.getElementById('up-a').files[0];
  if (!aFile) { showMsg('gal-msg','"Sonra" şəkli mütləq lazımdır.',true); return; }

  const btn = document.getElementById('gal-btn');
  btn.disabled = true; btn.textContent = 'Yüklənir...';

  try {
    const fd = new FormData();
    if (bFile) fd.append('before', bFile);
    fd.append('after', aFile);
    const names = await api('/upload', 'POST', fd);

    const item = {
      id: String(Date.now()),
      before: names.before || '',
      after:  names.after  || '',
      caption_az: form.querySelector('[name=caption_az]').value.trim(),
      caption_ru: form.querySelector('[name=caption_ru]').value.trim(),
      caption_en: form.querySelector('[name=caption_en]').value.trim(),
    };
    await api('/gallery', 'POST', item);
    galleryData.push(item);
    showMsg('gal-msg', '✅ Foto əlavə edildi!', false);
    form.reset();
    ['pb','pa'].forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });
    ['lb','la'].forEach(id => { const el=document.getElementById(id); if(el) el.textContent='📁 Şəkil seç'; });
    loadedTabs.delete('gallery'); loadGallery();
  } catch(err) {
    showMsg('gal-msg', 'Xəta: ' + err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Yüklə və əlavə et';
  }
}

async function deleteGallery(id) {
  if (!confirm('Bu foto cütünü silmək istəyirsiniz?')) return;
  try {
    await api(`/gallery/${id}`, 'DELETE');
    galleryData = galleryData.filter(g => g.id !== id);
    renderGallery();
  } catch(e) { alert('Xəta: ' + e.message); }
}

// ── Patients ──────────────────────────────────────────────────────────────────
async function loadPatients(q = '') {
  document.getElementById('patients-loading').style.display = 'block';
  document.getElementById('patients-content').style.display = 'none';
  try {
    patientsData = await api(`/patients${q ? '?q=' + encodeURIComponent(q) : ''}`);
    renderPatients();
  } catch(e) {
    document.getElementById('patients-loading').textContent = 'Xəta: ' + e.message;
  }
}

function renderPatients() {
  document.getElementById('patients-loading').style.display = 'none';
  const c = document.getElementById('patients-content');
  c.style.display = 'block';
  document.getElementById('tab-btn-patients').textContent = `👤 Xəstələr (${patientsData.length})`;

  const list = patientsData.length === 0
    ? '<div class="empty-state">👤 Xəstə tapılmadı.</div>'
    : patientsData.map(p => `
        <div class="patient-row ${selectedPatient?._id===p._id?'active':''}" onclick="selectPatient('${p._id}')">
          <div>
            <div class="patient-name">${esc(p.name)}</div>
            <div class="patient-meta">${esc(p.phone)} · ${DOCTORS[p.doctor]||'—'}</div>
          </div>
          <span class="patient-badge">${p.visits?.length||0} ziyarət</span>
        </div>`).join('');

  c.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div class="card-title" style="margin:0;border:none;padding:0">👤 Xəstə siyahısı</div>
        <button class="btn-outline" onclick="openAddPatient()">+ Yeni xəstə</button>
      </div>
      <div class="patient-search">
        <input type="text" id="patient-q" placeholder="Ad və ya telefon ilə axtar..." oninput="searchPatients(this.value)">
      </div>
      <div class="patient-list">${list}</div>
    </div>
    <div id="patient-detail-wrap"></div>
    <div id="add-patient-wrap"></div>`;

  if (selectedPatient) renderPatientDetail(selectedPatient);
}

let searchTimer;
function searchPatients(q) {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => loadPatients(q), 400);
}

async function selectPatient(id) {
  try {
    selectedPatient = await api(`/patients/${id}`);
    renderPatients();
    document.getElementById('patient-detail-wrap')?.scrollIntoView({ behavior: 'smooth' });
  } catch(e) { alert('Xəta: ' + e.message); }
}

function renderPatientDetail(p) {
  const wrap = document.getElementById('patient-detail-wrap');
  if (!wrap) return;

  const visits = p.visits?.length ? p.visits.map(v => `
    <div class="visit-card">
      <div class="visit-header">
        <span class="visit-date">${fmtDate(v.date)}</span>
        <button class="btn-sm btn-danger" onclick="deleteVisit('${p._id}','${v._id}')">🗑</button>
      </div>
      <div class="visit-tags">
        ${v.doctor    ? `<span class="tag tag-doctor">${esc(DOCTORS[v.doctor]||v.doctor)}</span>` : ''}
        ${v.treatment ? `<span class="tag tag-treatment">${esc(TREATMENTS[v.treatment]||v.treatment)}</span>` : ''}
        ${v.nextStep  ? `<span class="tag tag-next">${esc(NEXT_STEPS[v.nextStep]||v.nextStep)}</span>` : ''}
      </div>
      ${v.sessionNotes ? `<div class="visit-notes">${esc(v.sessionNotes)}</div>` : ''}
    </div>`).join('')
    : '<div class="empty-state" style="padding:24px">Hələ ziyarət qeydi yoxdur.</div>';

  wrap.innerHTML = `
    <div class="card patient-detail">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px">
        <div>
          <div style="font-size:1.1rem;font-weight:700">${esc(p.name)}</div>
          <div style="font-size:.85rem;color:#7f8c8d;margin-top:4px">
            ${esc(p.phone)}
            ${p.doctor ? ` · ${esc(DOCTORS[p.doctor])}` : ''}
            ${p.dob ? ` · ${fmtDate(p.dob)}` : ''}
          </div>
          ${p.notes ? `<div style="font-size:.85rem;color:#6b7280;margin-top:6px">${esc(p.notes)}</div>` : ''}
        </div>
        <button class="btn-sm btn-danger" onclick="deletePatient('${p._id}')">🗑 Sil</button>
      </div>
      <div class="card-title">Ziyarət tarixçəsi</div>
      <div class="visit-list">${visits}</div>
      <button class="btn-outline" onclick="openAddVisit('${p._id}')">+ Ziyarət əlavə et</button>
      <div id="add-visit-wrap-${p._id}" style="margin-top:16px"></div>
    </div>`;
}

function openAddPatient() {
  const wrap = document.getElementById('add-patient-wrap');
  wrap.innerHTML = `
    <div class="card">
      <div class="card-title">➕ Yeni xəstə</div>
      <div id="add-p-msg" style="display:none"></div>
      <form id="add-p-form" onsubmit="submitAddPatient(event)">
        <div class="form-row">
          <div class="field"><label>Ad Soyad *</label>
            <input name="name" required placeholder="Leyla Əliyeva"></div>
          <div class="field"><label>Telefon *</label>
            <input name="phone" required placeholder="+994..."></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Doğum tarixi</label>
            <input name="dob" type="date"></div>
          <div class="field"><label>Cins</label>
            <select name="gender"><option value="">—</option><option value="female">Qadın</option><option value="male">Kişi</option></select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Əsas həkim</label>
            <select name="doctor"><option value="">—</option><option value="aygun">Dr. Aygün Rzayeva</option><option value="elcan">Dr. Elcan Həmidli</option></select></div>
        </div>
        <div class="field"><label>Qeyd (ixtiyari)</label>
          <textarea name="notes" rows="2" placeholder="Tibbi tarixçə, allergiya, qeydlər..."></textarea></div>
        <div style="display:flex;gap:10px">
          <button type="submit" id="add-p-btn" class="btn-primary" style="flex:1">Əlavə et</button>
          <button type="button" class="btn-outline" onclick="document.getElementById('add-patient-wrap').innerHTML=''">Ləğv et</button>
        </div>
      </form>
    </div>`;
  wrap.scrollIntoView({ behavior: 'smooth' });
}

async function submitAddPatient(e) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById('add-p-btn');
  btn.disabled = true; btn.textContent = 'Əlavə edilir...';
  try {
    const body = {
      name:   form.name.value.trim(),
      phone:  form.phone.value.trim(),
      gender: form.gender.value,
      doctor: form.doctor.value,
      notes:  form.notes.value.trim(),
    };
    if (form.dob.value) body.dob = form.dob.value;
    await api('/patients', 'POST', body);
    showMsg('add-p-msg', '✅ Xəstə əlavə edildi!', false);
    form.reset();
    loadedTabs.delete('patients');
    await loadPatients();
  } catch(err) {
    showMsg('add-p-msg', 'Xəta: ' + err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Əlavə et';
  }
}

function openAddVisit(patientId) {
  const today = new Date().toISOString().split('T')[0];
  const wrap = document.getElementById(`add-visit-wrap-${patientId}`);
  if (!wrap) return;
  wrap.innerHTML = `
    <div class="card" style="margin-top:0;border-top:2px solid #e8f0fb">
      <div class="card-title" style="font-size:.95rem">Yeni ziyarət qeydi</div>
      <div id="visit-msg-${patientId}" style="display:none"></div>
      <form id="visit-form-${patientId}" onsubmit="submitVisit(event,'${patientId}')">
        <div class="form-row">
          <div class="field"><label>Tarix</label>
            <input name="date" type="date" value="${today}" required></div>
          <div class="field"><label>Həkim</label>
            <select name="doctor"><option value="">—</option>
              <option value="aygun">Dr. Aygün Rzayeva</option>
              <option value="elcan">Dr. Elcan Həmidli</option>
            </select></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Müalicə növü</label>
            <select name="treatment">
              ${Object.entries(TREATMENTS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
            </select></div>
          <div class="field"><label>Növbəti addım</label>
            <select name="nextStep">
              ${Object.entries(NEXT_STEPS).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
            </select></div>
        </div>
        <div class="field"><label>Qeyd (ixtiyari)</label>
          <textarea name="sessionNotes" rows="2" placeholder="Bu sessiyadə görülən işlər..."></textarea></div>
        <div style="display:flex;gap:10px">
          <button type="submit" id="visit-btn-${patientId}" class="btn-primary" style="flex:1">Qeyd et</button>
          <button type="button" class="btn-outline" onclick="this.closest('.card').remove()">Ləğv et</button>
        </div>
      </form>
    </div>`;
}

async function submitVisit(e, patientId) {
  e.preventDefault();
  const form = e.target;
  const btn = document.getElementById(`visit-btn-${patientId}`);
  btn.disabled = true; btn.textContent = 'Saxlanır...';
  try {
    const body = {
      date:         form.date.value,
      doctor:       form.doctor.value,
      treatment:    form.treatment.value,
      nextStep:     form.nextStep.value,
      sessionNotes: form.sessionNotes.value.trim(),
    };
    await api(`/patients/${patientId}/visits`, 'POST', body);
    selectedPatient = await api(`/patients/${patientId}`);
    renderPatients();
  } catch(err) {
    showMsg(`visit-msg-${patientId}`, 'Xəta: ' + err.message, true);
    btn.disabled = false; btn.textContent = 'Qeyd et';
  }
}

async function deleteVisit(patientId, visitId) {
  if (!confirm('Bu ziyarət qeydini silmək istəyirsiniz?')) return;
  try {
    await api(`/patients/${patientId}/visits/${visitId}`, 'DELETE');
    selectedPatient = await api(`/patients/${patientId}`);
    renderPatients();
  } catch(e) { alert('Xəta: ' + e.message); }
}

async function deletePatient(id) {
  if (!confirm('Bu xəstəni tamamilə silmək istəyirsiniz? Bütün qeydlər silinəcək.')) return;
  try {
    await api(`/patients/${id}`, 'DELETE');
    selectedPatient = null;
    loadedTabs.delete('patients');
    await loadPatients();
  } catch(e) { alert('Xəta: ' + e.message); }
}

// ── Settings ──────────────────────────────────────────────────────────────────
document.getElementById('pw-form').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target;
  if (form.password.value !== form.confirm.value) {
    showMsg('pw-msg','Şifrələr eyni deyil.',true); return;
  }
  const btn = form.querySelector('button');
  btn.disabled = true; btn.textContent = 'Dəyişdirilir...';
  try {
    await api('/auth/change-password', 'POST', { password: form.password.value });
    showMsg('pw-msg', '✅ Şifrə dəyişdirildi. Yenidən daxil olun.', false);
    form.reset();
    setTimeout(logout, 2000);
  } catch(err) {
    showMsg('pw-msg', 'Xəta: ' + err.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Dəyiş';
  }
});

// ── Start ─────────────────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
